<!DOCTYPE html>
<html>
<head>
    <title>Web to APK Converter</title>
    <meta charset="utf-8">
    <style>
        body { 
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Web to APK Converter</h1>
        <p>ادخل رابط موقعك لتحويله إلى تطبيق Android</p>
        
        <input type="url" id="websiteUrl" placeholder="https://example.com" style="width: 300px; padding: 10px;">
        <button onclick="convertToApk()">تحويل إلى APK</button>
        
        <div id="result" style="margin-top: 20px;"></div>
    </div>

    <script>
        function convertToApk() {
            const url = document.getElementById('websiteUrl').value;
            const resultDiv = document.getElementById('result');
            
            if (!url) {
                resultDiv.innerHTML = '<p style="color: red;">⚠️ من فضلك ادخل رابط الموقع</p>';
                return;
            }
            
            resultDiv.innerHTML = `
                <p>✅ جاري تحويل الموقع: <strong>${url}</strong></p>
                <p>📱 سيتم إنشاء التطبيق قريباً...</p>
            `;
        }
    </script>
</body>
</html>
