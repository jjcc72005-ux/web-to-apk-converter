<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول الويب إلى APK</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 محول الويب إلى تطبيق Android</h1>
        
        <div class="input-group">
            <label for="websiteUrl">رابط الموقع:</label>
            <input type="url" id="websiteUrl" placeholder="https://example.com" required>
        </div>
        
        <div class="input-group">
            <label for="appName">اسم التطبيق:</label>
            <input type="text" id="appName" placeholder="My Awesome App" value="MyWebApp">
        </div>
        
        <button onclick="convertToApk()">🚀 إنشاء تطبيق Android</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function convertToApk() {
            const url = document.getElementById('websiteUrl').value;
            const appName = document.getElementById('appName').value;
            const resultDiv = document.getElementById('result');
            
            if (!url) {
                showResult('⚠️ من فضلك ادخل رابط الموقع', 'error');
                return;
            }
            
            showResult('⏳ جاري إنشاء التطبيق...', 'loading');
            
            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: url,
                        app_name: appName
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showResult(`✅ ${data.message}`, 'success');
                } else {
                    showResult(`❌ ${data.error}`, 'error');
                }
                
            } catch (error) {
                showResult('❌ حدث خطأ في الاتصال بالخادم', 'error');
            }
        }
        
        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = type;
            resultDiv.innerHTML = message;
        }
    </script>
</body>
</html>
